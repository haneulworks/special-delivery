
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f5">

    <title>선물이 도착했어요 💌</title>
    <meta name="description" content="특별한 소식이 담긴 편지가 도착했어요 ♡">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="선물이 도착했어요 💌">
    <meta property="og:description" content="특별한 소식이 담긴 편지가 도착했어요 ♡">
    <meta property="og:image" content="https://haneulworks.github.io/special-delivery/images/og-image.png">
    <meta property="og:url" content="https://haneulworks.github.io/special-delivery/">

    <link rel="stylesheet" href="./css/style.css">

    <!-- Kakao SDK -->
    <script
        src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js"
        integrity="sha384-tJkjbtDbvoxO+diRuDtwRO9JXR7pjWnfjfRn5ePUpl7e7RJCxKCwwnfqUAdXh53p"
        crossorigin="anonymous"
        defer>
    </script>
    <script src="./js/main.js" defer></script>
</head>
<body>
    <main class="stage">

        <!-- 인트로 -->
        <section class="intro" id="intro" aria-labelledby="intro-title">
            <p class="eyebrow">A SPECIAL DELIVERY FOR YOU</p>

            <h1 id="intro-title">선물이 도착했어요 💌</h1>
            <p class="intro-sub">당신에게 전하고 싶은 특별한 소식이 있어요.</p>

            <button
                type="button"
                class="envelope"
                id="open-envelope"
                aria-label="편지 봉투 열기">

                <span class="env-back" aria-hidden="true"></span>

                <span class="env-letter" aria-hidden="true">
                    For you ♡
                </span>

                <span class="env-front" aria-hidden="true"></span>
                <span class="env-flap" aria-hidden="true"></span>
                <span class="seal" aria-hidden="true">♥</span>
            </button>

            <p class="hint">봉투를 터치해서 열어보세요 ♡</p>
        </section>

        <!-- 임밍아웃 카드 -->
        <section
            class="card"
            id="announcement"
            aria-labelledby="card-title"
            hidden>

            <p class="eyebrow">OUR LITTLE BLESSING</p>

            <div class="photo-frame">
                <img
                    src="./images/my-blessing.jpg"
                    alt="축복이의 첫 초음파 사진"
                    class="ultrasound">
            </div>

            <h2 id="card-title" data-greeting>반가워요! ♥</h2>

            <img
                class="sheep"
                src="./images/sheep-baby.png"
                alt="양옷을 입고 웃고 있는 아기 축복이">

            <p class="baby-name">
                저는 <strong>축복이</strong>예요!
            </p>

            <p class="due-date">
                2027년 6월 20일에 만나요 ♡
            </p>

            <div class="dday-box">
                <p>축복이를 만나는 날까지</p>
                <strong id="dday-count">D-</strong>
            </div>

            <p class="signoff">조금만 기다려 주세요 ♡</p>

            <button type="button" id="kakaotalk-sharing-btn" aria-label="카카오톡으로 공유">
                <img src="./images/icon-kakao.png" alt="">
                <span>카카오톡으로 공유</span>
            </button>

            <p id="share-status" class="share-status" role="status" aria-live="polite"></p>

        </section>
    </main>
</body>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js" integrity="sha384-BGX7Wb16GmRFagri4bLJV2DgipVZaU2AI812GZtHtHzzDQJnfHasDXN5houxv45w" crossorigin="anonymous"></script>

<script>
    //JavaScript SDK 초기화 함수
    Kakao.init("f6f04b66664ff3dccd99214875b0c02d")
    Kakao.Share.createCustomButton({
        // 카카오톡 공유 버튼 표준 이미지를 클릭 동작으로 연결
        container: "#kakaotalk-sharing-btn",
        templateId: 138465,
        templateArgs: {
        NAME: "이하늘",
        },
    })
    </script>

</html>
