<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff8f5">
    <meta name="description" content="당신에게 도착한 특별한 편지, 지금 열어보세요 ♡">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="선물이 도착했어요 💌">
    <meta property="og:description" content="당신에게 도착한 특별한 편지, 지금 열어보세요 ♡">
    <meta property="og:url" content="https://haneulworks.github.io/special-delivery/">
    <meta property="og:image" content="https://haneulworks.github.io/special-delivery/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>선물이 도착했어요 💌</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 카카오톡 공유 버튼 사용 시 아래 SDK를 활성화하고 js/main.js에 JavaScript 키를 입력하세요. -->
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous" onerror="window.kakaoSdkFailed=true"></script>
    <script defer src="./js/main.js"></script>
</head>
<body>
    <main class="stage">
        <section class="intro" id="intro" aria-labelledby="intro-title">
            <p class="eyebrow">SPECIAL DELIVERY · FOR YOU</p>
            <h1 id="intro-title">선물이 도착했어요 💌</h1>
            <p class="intro-sub">당신에게 전하고 싶은 작은 소식이 있어요.</p>
            <button class="envelope" id="open-envelope" type="button" aria-label="편지 봉투 열기">
                <span class="env-back"></span><span class="env-letter">for you ♡</span><span class="env-front"></span><span class="env-flap"></span><span class="seal">♥</span>
            </button>
            <p class="hint">봉투를 살짝 눌러주세요 ♡</p>
        </section>

        <section class="card" id="announcement" aria-labelledby="card-title" hidden>
            <p class="eyebrow">OUR LITTLE BLESSING</p>
            <div class="photo-frame"><img src="./images/my-blessing.jpg" alt="축복이의 첫 초음파 사진" class="ultrasound"></div>
            <h2 id="card-title"><span data-recipient>이모</span>, 반가워요! ♥</h2>
            <img class="sheep" src="./images/sheep-baby.png" alt="웃고 있는 아기 양 축복이">
            <p class="baby-name">저는 <strong>축복이</strong>예요!</p>
            <p class="due-date">2027년 6월 20일에 만나요 ♡</p>
            <div class="dday-box" aria-live="polite"><p>축복이를 만나는 날까지</p><strong id="dday-count">D-</strong></div>
            <p class="signoff">조금만 기다려 주세요 ♡</p>
            <button type="button" id="kakaotalk-sharing-btn"><img src="./images/icon-kakao.png" alt="카카오톡 아이콘" />카카오톡으로 공유</button>
        </section>
    </main>
</body>
<script
    src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js"
    integrity="sha384-tJkjbtDbvoxO+diRuDtwRO9JXR7pjWnfjfRn5ePUpl7e7RJCxKCwwnfqUAdXh53p"
    crossorigin="anonymous">
</script>
</html>
