
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f5">

    <title>선물이 도착했어요 💌</title>
    <meta name="description" content="무엇이 들어 있을까요? 열어서 확인해 보세요!">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="선물이 도착했어요 💌">
    <meta property="og:description" content="무엇이 들어 있을까요? 열어서 확인해 보세요!">
    <meta property="og:image" content="https://haneulworks.github.io/special-delivery/images/og-image.jpg">
    <meta property="og:url" content="https://haneulworks.github.io/special-delivery/">

    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Jua&display=swap" rel="stylesheet">

    <!-- Kakao SDK -->
    <script
        src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js"
        integrity="sha384-tJkjbtDbvoxO+diRuDtwRO9JXR7pjWnfjfRn5ePUpl7e7RJCxKCwwnfqUAdXh53p"
        crossorigin="anonymous"
        defer>
    </script>
    <script src="./js/main.js" defer></script>
</head>
<body>
    <main class="stage">

        <!-- 인트로 -->
        <section class="intro" id="intro" aria-labelledby="intro-title">
            <p class="eyebrow">A SPECIAL DELIVERY FOR YOU</p>

            <h1 id="intro-title">선물이 도착했어요 💌</h1>
            <p class="intro-sub">당신에게 전하고 싶은 특별한 소식이 있어요.</p>

            <button type="button" class="envelope" id="open-envelope" aria-label="편지 봉투 열기">

                <span class="env-back" aria-hidden="true"></span>

                <span class="env-letter" aria-hidden="true">For you ♥</span>

                <span class="env-front" aria-hidden="true"></span>
                <span class="env-flap" aria-hidden="true"></span>
                <span class="seal" aria-hidden="true">♥</span>
            </button>

            <p class="hint">봉투를 터치해서 열어보세요 ♡</p>
        </section>

        <!-- 임밍아웃 카드 -->
        <section class="card" id="announcement" aria-labelledby="card-title" hidden>

            <p class="eyebrow">OUR LITTLE BLESSING</p>

            <div class="photo-frame">
                <img src="./images/5weeks.jpg" alt="축복이의 초음파 사진" class="ultrasound">
            </div>

            <h2 id="card-title" data-greeting>반가워요! ♥</h2>

            <img class="sheep" src="./images/sheep-baby.png" alt="양옷을 입고 웃고 있는 아기">

            <p class="baby-name">
                저는 <strong>축복이</strong>예요!
            </p>

            <p class="due-date">
                2027년 6월 20일에 만나요 ♡
            </p>

            <div class="dday-box">
                <p>축복이를 만나는 날까지</p>
                <strong id="dday-count">D-</strong>
            </div>

            <p class="signoff">조금만 기다려 주세요 ♡</p>

        </section>
    </main>
</body>
</html>
